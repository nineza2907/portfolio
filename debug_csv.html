<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Debug</title>
<style>
body { font-family: monospace; background: #111; color: #eee; padding: 16px; font-size: 12px; }
h2 { color: #f0c040; }
pre { background: #1a1a2e; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.ok { color: #4caf50; }
.err { color: #f44336; }
.warn { color: #ff9800; }
button { background: #f0c040; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin: 8px 4px; }
</style>
</head>
<body>
<h2>🔍 CSV Debug Tool</h2>
<p>กด Fetch แล้วดูผลลัพธ์ด้านล่าง</p>
<button onclick="testFetch()">▶ Fetch Transactions CSV</button>
<button onclick="clearLog()">🗑 Clear</button>
<div id="log"></div>

<script>
const SHEET_ID = '13SscZvWLqjV7HxMXnYlodB2RkTj2xFnic-QlxCW4eAA';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=transactions`;

function log(msg, cls='') {
  const d = document.getElementById('log');
  const pre = document.createElement('pre');
  pre.className = cls;
  pre.textContent = msg;
  d.appendChild(pre);
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

async function testFetch() {
  clearLog();
  log('Fetching: ' + URL);
  
  try {
    const res = await fetch(URL);
    log(`Status: ${res.status} ${res.statusText}`, res.ok ? 'ok' : 'err');
    
    const text = await res.text();
    log(`Text length: ${text.length} chars`);
    
    // ตรวจ line endings
    const hasCRLF = text.includes('\r\n');
    const hasLF   = text.includes('\n');
    log(`Line endings: CRLF=${hasCRLF} LF=${hasLF}`, 'warn');
    
    // Split ด้วย regex
    const lines = text.trim().split(/\r?\n/);
    log(`Lines count: ${lines.length}`);
    log(`Header: ${lines[0]}`);
    
    // Parse header
    const hdr = lines[0].split(',').map(h => h.trim().replace(/"/g,'').toLowerCase());
    const iAsset    = hdr.indexOf('asset');
    const iType     = hdr.indexOf('type');
    const iAction   = hdr.indexOf('action');
    const iQty      = hdr.indexOf('quantity');
    const iTotalThb = hdr.indexOf('total_thb');
    log(`Indices: asset=${iAsset} type=${iType} action=${iAction} qty=${iQty} total_thb=${iTotalThb}`, 'ok');
    
    // Parse rows
    let grandTotal = 0, usTotal = 0, btcCost = 0;
    let rows = [];
    
    for (let i = 1; i < lines.length; i++) {
      const ln = lines[i].trim();
      if (!ln) continue;
      
      // parseCSVLine
      const cols = [];
      let cur = '', inQ = false;
      for (let j = 0; j < ln.length; j++) {
        const ch = ln[j];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur.trim());
      const cleaned = cols.map(c => c.replace(/^"|"$/g,'').replace(/,/g,''));
      
      const asset  = (cleaned[iAsset]    || '').trim().toUpperCase();
      const type   = (cleaned[iType]     || '').trim().toLowerCase();
      const action = (cleaned[iAction]   || '').trim().toUpperCase();
      const qty    = parseFloat(cleaned[iQty] || '0') || 0;
      const thb    = parseFloat(cleaned[iTotalThb] || '0') || 0;
      
      rows.push({i, asset, type, action, qty, thb, raw_thb: cleaned[iTotalThb]});
      
      if (action === 'BUY' && qty > 0) {
        grandTotal += thb;
        if (type === 'us') usTotal += thb;
        if (type === 'crypto') btcCost += thb;
      }
    }
    
    // แสดง rows
    log('\n--- Parsed Rows ---');
    rows.forEach(r => {
      const ok = r.action === 'BUY' && r.qty > 0;
      log(`L${r.i}: ${r.asset.padEnd(6)} ${r.type.padEnd(7)} ${r.action.padEnd(4)} qty=${r.qty.toFixed(4)} thb=${r.thb.toFixed(2)} raw=${r.raw_thb}`, ok ? 'ok' : '');
    });
    
    log('\n--- RESULT ---', 'ok');
    log(`grandTotal = ${grandTotal.toFixed(2)}`, grandTotal > 50000 ? 'ok' : 'err');
    log(`usTotal    = ${usTotal.toFixed(2)}`, usTotal > 30000 ? 'ok' : 'err');
    log(`btcCost    = ${btcCost.toFixed(2)}`, btcCost > 0 ? 'ok' : 'err');
    
    if (grandTotal > 50000) {
      log('\n✅ Data OK — grandTotal should show as ฿' + Math.round(grandTotal).toLocaleString(), 'ok');
    } else {
      log('\n❌ grandTotal too low — check parsing above', 'err');
    }
    
  } catch(e) {
    log('ERROR: ' + e.message, 'err');
    log(e.stack, 'err');
  }
}
</script>
</body>
</html>
